body.category-page-white,
body.category-page-milk,
body.category-page-dark {
  min-height: 100vh;
  position: relative;
  isolation: isolate;
  transition:
    background 0.65s ease,
    color 0.35s ease;
}

body.category-page-white::before,
body.category-page-milk::before,
body.category-page-dark::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

body.category-page-white #main,
body.category-page-milk #main,
body.category-page-dark #main {
  position: relative;
  z-index: 1;
  animation: categoryThemeEnter .45s ease both;
}

@keyframes categoryThemeEnter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  // Catégories visibles dans le catalogue : uniquement les familles souhaitées.
  const CATEGORIES = [
    'Chocolat blanc 25% Cacao',
    'Chocolat au lait 35% cacao minimum',
    'Chocolat noir',
    'Spécialités de Pâques',
    'Spécialités de Noël'
  ];
  const COATINGS = ['Noir', 'Lait', 'Blanc', 'Blond'];

  function catalogueCategory(c) {
    if (c.category === 'Spécialités de Pâques' || c.category === 'Spécialités de Noël') return c.category;
    if (c.coating === 'Blanc') return 'Chocolat blanc 25% Cacao';
    if (c.coating === 'Lait') return 'Chocolat au lait 35% cacao minimum';
    if (c.coating === 'Noir') return 'Chocolat noir';
    return null;
  }

  const STORAGE_KEY = 'academieCacaoState_v1';

  const defaultState = {
    masteredIds: [],
    revisionIds: [],
    stats: {
      answered: 0,
      correct: 0,
      bestStreak: 0,
      currentStreak: 0,
      sessions: 0
    }
  };

  let state = loadState();

  let currentTab = 'catalogue';
  let catalogueState = {
    search: '',
    coating: 'Tous',
    category: 'Toutes'
  };

  let quizState = null;

  // ============================================================
  // STORAGE
  // ============================================================
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return {
        masteredIds: Array.isArray(parsed.masteredIds) ? parsed.masteredIds : [],
        revisionIds: Array.isArray(parsed.revisionIds) ? parsed.revisionIds : [],
        stats: {
          ...defaultState.stats,
          ...(parsed.stats || {})
        }
      };
    } catch (error) {
      console.warn('Impossible de lire localStorage:', error);
      return structuredClone(defaultState);
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateGlobalBadges();
  }

  function resetState() {
    state = structuredClone(defaultState);
    saveState();
  }

  // ============================================================
  // HELPERS
  // ============================================================
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function getChocolate(id) {
    return CHOCOLATES_DB.find(c => c.id === id);
  }

  function isMastered(id) {
    return state.masteredIds.includes(id);
  }

  function isInRevision(id) {
    return state.revisionIds.includes(id);
  }

  function masteryPercent() {
    return Math.round((state.masteredIds.length / CHOCOLATES_DB.length) * 100);
  }

  function totalPending() {
    return state.revisionIds.length;
  }

  function showToast(message, type = 'success') {
    const root = $('#toastRoot');
    const icon = type === 'success' ? 'fa-circle-check' :
                 type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info';
    const tone = type === 'success' ? 'text-turquoise-700 bg-turquoise-50 border-turquoise-200' :
                 type === 'warning' ? 'text-[#775E00] bg-[#FFF9E8] border-[#EAD78B]' :
                 'text-cacao-700 bg-white border-cacao-200';

    const el = document.createElement('div');
    el.className = `glass animate-fade-up flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-luxury ${tone}`;
    el.innerHTML = `
      <i class="fa-solid ${icon} mt-0.5"></i>
      <div class="flex-1 text-sm font-semibold leading-5">${escapeHtml(message)}</div>
      <button class="opacity-50 hover:opacity-100" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    `;
    el.querySelector('button').addEventListener('click', () => el.remove());
    root.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(-4px)';
      el.style.transition = 'all .25s ease';
      setTimeout(() => el.remove(), 250);
    }, 3400);
  }

  function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(array, n) {
    return shuffle(array).slice(0, n);
  }

  function coatingClass(coating) {
    return {
      Noir: 'bg-cacao-900 text-white',
      Lait: 'bg-[#9B6A45] text-white',
      Blanc: 'bg-white text-cacao-700 border border-cacao-200',
      Blond: 'bg-[#D59F42] text-white'
    }[coating] || 'bg-cacao-700 text-white';
  }

  function categoryIcon(category) {
    if (category.includes('Pralinés')) return 'fa-cookie-bite';
    if (category.includes('Ganaches')) return 'fa-droplet';
    if (category.includes('Amande')) return 'fa-seedling';
    if (category.includes('Pâques')) return 'fa-egg';
    if (category.includes('Noël')) return 'fa-tree';
    return 'fa-layer-group';
  }

  function categoryThemeClass(choco) {
  if (choco.coating === 'Blanc') return 'category-white';
  if (choco.coating === 'Lait') return 'category-milk';
  if (choco.coating === 'Noir') return 'category-dark';
  return '';
}

  function questionTypeLabel(type) {
    return {
      visual: 'Œil & forme',
      filling: 'Garniture',
      coating: 'Enrobage'
    }[type];
  }

  function formatDate() {
    return new Intl.DateTimeFormat('fr-FR', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    }).format(new Date());
  }

  // ============================================================
  // PROCEDURAL SVG CHOCOLATE ENGINE
  // ============================================================
  function generateChocolateSVG(choco, size = 220) {
    const esc = escapeHtml(choco.name);
    if (choco.image) {
      return `<div class="flex items-center justify-center" style="width:${size}px;height:${size}px">
        <img src="${escapeHtml(choco.image)}" alt="${esc}" loading="lazy"
          class="max-h-full max-w-full object-contain drop-shadow-[0_12px_12px_rgba(34,20,14,.14)]"
          referrerpolicy="no-referrer"
          onerror="this.closest('div').innerHTML='<div class=\'text-center text-xs font-semibold text-cacao-500 p-4\'>Image officielle indisponible</div>'">
      </div>`;
    }
    const uid = ('svg_' + choco.id).replace(/[^a-z0-9_]/gi, '_');

    const palette = {
      Noir: { main: '#26140C', dark: '#120906', light: '#553024', highlight: '#78503B' },
      Lait: { main: '#7C4D2E', dark: '#3D2314', light: '#B97A52', highlight: '#D39A6A' },
      Blanc: { main: '#F4E7D7', dark: '#C7AE91', light: '#FFFDF9', highlight: '#FFFFFF' },
      Blond: { main: '#B56F1A', dark: '#7A4310', light: '#E3B365', highlight: '#F4D08F' }
    }[choco.coating];

    const defs = `
      <defs>
        <linearGradient id="${uid}_base" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="${palette.highlight}" />
          <stop offset="48%" stop-color="${palette.main}" />
          <stop offset="100%" stop-color="${palette.dark}" />
        </linearGradient>
        <radialGradient id="${uid}_shine" cx="35%" cy="25%" r="70%">
          <stop offset="0%" stop-color="${palette.light}" stop-opacity=".72"/>
          <stop offset="42%" stop-color="${palette.main}" stop-opacity=".14"/>
          <stop offset="100%" stop-color="${palette.dark}" stop-opacity=".56"/>
        </radialGradient>
        <filter id="${uid}_shadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#22140E" flood-opacity=".22"/>
        </filter>
        <linearGradient id="${uid}_gold" x1="0" x2="1">
          <stop offset="0%" stop-color="#A77E16"/>
          <stop offset="42%" stop-color="#F7E7A3"/>
          <stop offset="68%" stop-color="#D4AF37"/>
          <stop offset="100%" stop-color="#8D6B12"/>
        </linearGradient>
      </defs>
    `;

    const fill = `url(#${uid}_base)`;
    const shine = `url(#${uid}_shine)`;
    let body = '';

    switch (choco.shape) {
      case 'disc':
        body = `<ellipse cx="110" cy="116" rx="82" ry="66" fill="${fill}"/>`;
        break;
      case 'dome':
        body = `<path d="M28 142C31 90 64 50 110 50s79 40 82 92c-1 17-14 23-31 23H59c-17 0-30-6-31-23Z" fill="${fill}"/>`;
        break;
      case 'square':
        body = `<rect x="37" y="45" width="146" height="146" rx="24" fill="${fill}"/>`;
        break;
      case 'lingot':
        body = `<path d="M48 62h124l20 28-12 72H48l-12-72 20-28Z" fill="${fill}"/>`;
        break;
      case 'oval':
        body = `<ellipse cx="110" cy="118" rx="94" ry="58" transform="rotate(-8 110 118)" fill="${fill}"/>`;
        break;
      case 'losange':
        body = `<path d="M110 38L186 112L110 190L34 112Z" fill="${fill}"/>`;
        break;
      case 'heart':
        body = `<path d="M110 188C96 176 38 136 38 84c0-22 17-39 38-39 15 0 27 8 34 20 7-12 19-20 34-20 21 0 38 17 38 39 0 52-58 92-72 104Z" fill="${fill}"/>`;
        break;
      case 'truffe':
        body = `<path d="M58 134c-8-21 2-58 31-75 28-16 70-10 83 20 12 28-2 64-24 82-22 17-78 17-90-27Z" fill="${fill}"/>`;
        break;
      case 'shell':
        body = `<path d="M44 160V92c0-33 28-55 66-55s66 22 66 55v68c0 16-11 28-27 28H71c-16 0-27-12-27-28Z" fill="${fill}"/>`;
        break;
      case 'hexagon':
      default:
        body = `<path d="M69 40h82l44 73-44 73H69l-44-73 44-73Z" fill="${fill}"/>`;
        break;
    }

    const commonShine = `<path d="M68 74c22-18 55-28 78-13" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="6" stroke-linecap="round"/>`;
    let decor = '';

    switch (choco.decor) {
      case 'gold':
        decor = `
          <path d="M63 88c24-17 53-22 89-11" fill="none" stroke="url(#${uid}_gold)" stroke-width="9" stroke-linecap="round"/>
          <circle cx="145" cy="79" r="3" fill="#F7E7A3"/>
          <circle cx="154" cy="87" r="2" fill="#D4AF37"/>
        `;
        break;
      case 'goldstripe':
        decor = `
          <path d="M48 140c27-16 81-24 129-5" fill="none" stroke="url(#${uid}_gold)" stroke-width="8" stroke-linecap="round"/>
        `;
        break;
      case 'zebras':
        decor = `
          <path d="M54 83L91 103M50 107l45 24M132 75l33 20M121 102l44 23M112 133l36 18" stroke="#00B2A9" stroke-width="7" stroke-linecap="round" stroke-opacity=".9"/>
        `;
        break;
      case 'cacao':
        decor = `
          <g fill="#2F1B12" opacity=".75">
            <circle cx="69" cy="91" r="4"/><circle cx="92" cy="75" r="3"/><circle cx="126" cy="86" r="4"/>
            <circle cx="149" cy="106" r="3"/><circle cx="80" cy="127" r="3"/><circle cx="121" cy="140" r="4"/>
            <circle cx="145" cy="126" r="3"/><circle cx="99" cy="106" r="3"/>
          </g>
        `;
        break;
      case 'pecan':
        decor = `
          <path d="M110 71c14-13 34-11 40 4 7 19-15 33-32 25-15-7-20-18-8-29Z" fill="#8F5F39"/>
          <path d="M114 74c11-4 22 0 26 9" fill="none" stroke="#D8A779" stroke-width="3" stroke-linecap="round"/>
        `;
        break;
      case 'pistachio':
        decor = `
          <path d="M68 157c31-15 68-15 95 0" fill="none" stroke="#83A846" stroke-width="8" stroke-linecap="round"/>
          <circle cx="66" cy="157" r="4" fill="#C3D98C"/><circle cx="165" cy="157" r="4" fill="#C3D98C"/>
        `;
        break;
      case 'nuts':
        decor = `
          <g fill="#B27A50" stroke="#5E361E" stroke-width="2">
            <ellipse cx="71" cy="88" rx="13" ry="9" transform="rotate(-20 71 88)"/>
            <ellipse cx="105" cy="73" rx="15" ry="10" transform="rotate(15 105 73)"/>
            <ellipse cx="145" cy="89" rx="12" ry="9" transform="rotate(-12 145 89)"/>
            <ellipse cx="125" cy="127" rx="15" ry="10" transform="rotate(18 125 127)"/>
            <ellipse cx="82" cy="130" rx="13" ry="9" transform="rotate(4 82 130)"/>
          </g>
        `;
        break;
      case 'orange':
        decor = `
          <path d="M132 83c10-11 30-10 34 2 5 14-12 22-24 15-10-6-16-9-10-17Z" fill="#E98630"/>
          <circle cx="150" cy="89" r="3" fill="#FFC46F"/><circle cx="158" cy="95" r="2" fill="#FFC46F"/>
        `;
        break;
      case 'dots':
      case 'cocoa-dots':
        decor = `
          <g fill="${choco.coating === 'Blanc' ? '#B87333' : '#E7A6A6'}">
            <circle cx="76" cy="82" r="4"/><circle cx="98" cy="72" r="3"/><circle cx="124" cy="79" r="4"/>
            <circle cx="149" cy="91" r="3"/><circle cx="86" cy="112" r="3"/><circle cx="114" cy="111" r="4"/>
            <circle cx="139" cy="125" r="3"/><circle cx="102" cy="137" r="3"/>
          </g>
        `;
        break;
      case 'line':
        decor = `<path d="M79 88c29 22 55 15 70-3" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>`;
        break;
      default:
        decor = '';
    }

    return `
      <svg viewBox="0 0 220 220" width="${size}" height="${size}" role="img" aria-label="${esc}" xmlns="http://www.w3.org/2000/svg">
        ${defs}
        <g filter="url(#${uid}_shadow)">
          <ellipse cx="110" cy="184" rx="70" ry="12" fill="#22140E" opacity=".09"/>
          ${body}
          <path d="M0 0h220v220H0z" fill="transparent"/>
          ${commonShine}
          <path d="M45 158c24 13 107 18 132-3" fill="none" stroke="${palette.dark}" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
          <path d="M62 62c20-17 59-22 96-10" fill="none" stroke="${shine}" stroke-width="7" stroke-linecap="round" opacity=".52"/>
          ${decor}
        </g>
      </svg>
    `;
  }

  // ============================================================
  // APP SHELL
  // ============================================================
  function render() {
    const main = $('#main');

    if (currentTab === 'catalogue') main.innerHTML = renderCatalogue();
    if (currentTab === 'quiz') main.innerHTML = renderQuizTab();
    if (currentTab === 'revision') main.innerHTML = renderRevision();
    if (currentTab === 'progression') main.innerHTML = renderProgression();

    syncNav();

    const isSeasonalCatalogue = currentTab === 'catalogue';

    document.body.classList.toggle(
        'christmas-mode',
        isSeasonalCatalogue && catalogueState.category === 'Spécialités de Noël'
    );

    document.body.classList.toggle(
        'easter-mode',
        isSeasonalCatalogue && catalogueState.category === 'Spécialités de Pâques'
    );

    /* ==========================================
       THÈMES PREMIUM DES CHOCOLATS
       ========================================== */

    document.body.classList.toggle(
        'category-page-white',
        isSeasonalCatalogue &&
        catalogueState.category === 'Chocolat blanc 25% Cacao'
    );

    document.body.classList.toggle(
        'category-page-milk',
        isSeasonalCatalogue &&
        catalogueState.category === 'Chocolat au lait 35% cacao minimum'
    );

    document.body.classList.toggle(
        'category-page-dark',
        isSeasonalCatalogue &&
        catalogueState.category === 'Chocolat noir'
    );

    /* ==========================================
       COULEUR DU NAVIGATEUR
       ========================================== */

    const themeMeta = document.querySelector('meta[name="theme-color"]');

    if (themeMeta) {
        themeMeta.content =
            catalogueState.category === 'Spécialités de Noël' && isSeasonalCatalogue
                ? '#123D2A'
                : catalogueState.category === 'Spécialités de Pâques' && isSeasonalCatalogue
                ? '#D989B6'
                : catalogueState.category === 'Chocolat blanc 25% Cacao' && isSeasonalCatalogue
                ? '#E8D6B5'
                : catalogueState.category === 'Chocolat au lait 35% cacao minimum' && isSeasonalCatalogue
                ? '#9A633B'
                : catalogueState.category === 'Chocolat noir' && isSeasonalCatalogue
                ? '#22140E'
                : '#22140E';
    }

    bindCurrentView();
    updateGlobalBadges();
}

  function syncNav() {
    $$('.nav-link, .mobile-nav-link').forEach(btn => {
      const active = btn.dataset.tab === currentTab;
      btn.classList.toggle('nav-active', active);
      if (!active) {
        btn.classList.remove('bg-white/10', 'text-white');
      }
    });
  }

  function updateGlobalBadges() {
    const count = state.revisionIds.length;
    const desktop = $('#headerRevisionBadge');
    const mobile = $('#mobileRevisionBadge');

    if (desktop) {
      desktop.textContent = count;
      desktop.classList.toggle('hidden', count === 0);
    }
    if (mobile) {
      mobile.textContent = count;
      mobile.classList.toggle('hidden', count === 0);
    }
    const headerMastery = $('#headerMastery');
    if (headerMastery) headerMastery.textContent = masteryPercent() + '%';
  }

  function setTab(tab) {
    currentTab = tab;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escCloseOnce(e) {
    if (e.key === 'Escape') closeModal();

  function closeModal() {
    $('#modalRoot').innerHTML = '';

  function toggleMastered(id) {
    if (isMastered(id)) {
      state.masteredIds = state.masteredIds.filter(x => x !== id);
      showToast('Chocolat retiré des maîtrisés.', 'warning');
    } else {
      state.masteredIds.push(id);
      state.revisionIds = state.revisionIds.filter(x => x !== id);
      showToast('Chocolat marqué comme maîtrisé.');
    }
    saveState();
    render();
  }

  function toggleRevision(id) {
    if (isInRevision(id)) {
      state.revisionIds = state.revisionIds.filter(x => x !== id);
      showToast('Chocolat retiré de la révision.');
    } else {
      state.revisionIds.push(id);

    saveState();
    render();

  function createQuizSession(categories, count, revisionOnly = false) {
    let pool = CHOCOLATES_DB.filter(c => revisionOnly ? state.revisionIds.includes(c.id) : true);

    if (!revisionOnly && !categories.includes('Toutes')) {
      pool = pool.filter(c => {
  const cat = catalogueCategory(c) || c.category;
  return categories.includes(cat);
});
    }

    if (revisionOnly) {
      pool = pool.length ? pool : CHOCOLATES_DB;
    }

    const actualCount = Math.min(count, pool.length);
    const selected = sample(pool, actualCount);

    quizState = {
      mode: 'playing',
      revisionOnly,
      selectedCategories: categories,
      questionCount: actualCount,
      questions: selected,
      index: 0,
      score: 0,
      sessionStreak: 0,
      sessionBestStreak: 0,
      answeredInSession: 0,
      results: [],
      answeredCurrent: false,
      currentQuestionType: null,
      currentOptions: []
    };

    prepareCurrentQuestion();
  }

  function prepareCurrentQuestion() {
    const q = quizState.questions[quizState.index];
    const types = ['visual', 'filling', 'coating'];
    quizState.currentQuestionType = types[quizState.index % types.length];
    quizState.currentOptions = createOptions(q, quizState.currentQuestionType);
    quizState.answeredCurrent = false;
  }

  function createOptions(correct, type) {
    const others = CHOCOLATES_DB.filter(c => c.id !== correct.id);
    if (type === 'visual') return shuffle([correct, ...sample(others, 3)]);
    if (type === 'filling') return shuffle([correct.filling, ...sample(others, 3).map(c => c.filling)]);
    if (type === 'coating') return shuffle([correct.coating, ...sample(COATINGS.filter(c => c !== correct.coating), 3)]);
    return [];
  }

        </div>

        <div class="mt-5 grid gap-3 sm:grid-cols-3">

  function answerCurrentQuiz(answer) {
    if (!quizState || quizState.answeredCurrent) return;

    const q = quizState.questions[quizState.index];
    const type = quizState.currentQuestionType;

    let isCorrect = false;
    if (type === 'visual') isCorrect = answer === q.id;
    if (type === 'filling') isCorrect = answer === q.filling;
    if (type === 'coating') isCorrect = answer === q.coating;

    quizState.answeredCurrent = true;
    quizState.answeredInSession += 1;

    state.stats.answered += 1;

    if (isCorrect) {
      state.stats.correct += 1;
      quizState.score += 1;
      quizState.sessionStreak += 1;
      quizState.sessionBestStreak = Math.max(quizState.sessionBestStreak, quizState.sessionStreak);
      state.stats.currentStreak += 1;
      state.stats.bestStreak = Math.max(state.stats.bestStreak, state.stats.currentStreak);
      state.masteredIds = [...new Set([...state.masteredIds, q.id])];
      state.revisionIds = state.revisionIds.filter(id => id !== q.id);
    } else {
      quizState.sessionStreak = 0;
      state.stats.currentStreak = 0;
      if (!state.revisionIds.includes(q.id)) state.revisionIds.push(q.id);
    }

    quizState.results.push({ id: q.id, correct: isCorrect, type });
    saveState();
    renderFeedbackModal(q, isCorrect, type);
  }

  function nextQuizStep() {
    closeModal();
    if (!quizState) return;

    if (quizState.index + 1 >= quizState.questions.length) {
      quizState.mode = 'result';
      state.stats.sessions += 1;
      saveState();
      render();
      return;
    }

    quizState.index += 1;
    prepareCurrentQuestion();
    render();
  }

          ${renderKPI('fa-fire', 'Meilleure série', state.stats.bestStreak, 'Bonnes réponses consécutives')}

  // ============================================================
  // EVENT BINDING
  // ============================================================
  function bindCurrentView() {
    // Header / navigation
    $$('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.dataset.tab));
    });

    $('#brandBtn')?.addEventListener('click', () => setTab('catalogue'));

    if (currentTab === 'catalogue') bindCatalogue();
    if (currentTab === 'quiz') bindQuiz();
    if (currentTab === 'revision') bindRevision();
    if (currentTab === 'progression') bindProgression();
  }

  function bindCatalogue() {
    $('#catalogueSearch')?.addEventListener('input', e => {
      catalogueState.search = e.target.value;
      render();
      const input = $('#catalogueSearch');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });

    $('#categoryFilter')?.addEventListener('change', e => {
      catalogueState.category = e.target.value;
      render();
    });

    $$('[data-coating]').forEach(btn => {
      btn.addEventListener('click', () => {
        catalogueState.coating = btn.dataset.coating;
        render();
      });
    });

    $$('[data-choco-id]').forEach(card => {
      card.addEventListener('click', () => openChocolateModal(card.dataset.chocoId));
    });
  }

  function bindQuiz() {
    $$('.question-count').forEach(btn => {
      btn.addEventListener('click', () => {
        quizState = quizState || {};
        quizState.questionCount = Number(btn.dataset.questionCount);
        render();
      });
    });

    $$('.quiz-cat').forEach(input => {
  input.addEventListener('change', (event) => {
    quizState = quizState || {};

    const clicked = event.target.value;

    // Si on clique sur "Toutes"
    if (clicked === 'Toutes') {
      $$('.quiz-cat').forEach(i => {
        i.checked = i.value === 'Toutes';
      });

      quizState.selectedCategories = ['Toutes'];
    } 
    
    // Si on clique sur une catégorie
    else {
      const toutes = $('.quiz-cat[value="Toutes"]');

      // Désactive "Toutes"
      if (toutes) toutes.checked = false;

      const checked = $$('.quiz-cat:checked')
        .map(i => i.value)
        .filter(value => value !== 'Toutes');

      // Si aucune catégorie n'est sélectionnée
      if (checked.length === 0) {
        if (toutes) toutes.checked = true;
        quizState.selectedCategories = ['Toutes'];
      } else {
        quizState.selectedCategories = checked;
      }
    }

    render();
  });
});

    $('#startQuizBtn')?.addEventListener('click', () => {
      const categories = quizState?.selectedCategories || ['Toutes'];
      const count = quizState?.questionCount || 10;
      createQuizSession(categories, count, false);
      render();
    });

    $('#startCatchupBtn')?.addEventListener('click', () => {
      createQuizSession(['Toutes'], Math.min(10, Math.max(5, state.revisionIds.length)), true);
      render();
    });

    $('#quitQuizBtn')?.addEventListener('click', () => {
      quizState = null;
      render();
    });

    $$('.quiz-answer').forEach(btn => {
      if (btn.dataset.answerId) {
        btn.addEventListener('click', () => answerCurrentQuiz(btn.dataset.answerId));
      }
      if (btn.dataset.answerIndex) {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.answerIndex);
          answerCurrentQuiz(quizState.currentOptions[index]);
        });
      }
      if (btn.dataset.answerValue) {
        btn.addEventListener('click', () => answerCurrentQuiz(btn.dataset.answerValue));
      }
    });

    $('#backToQuizSetup')?.addEventListener('click', () => {
      quizState = null;
      render();
    });

    $('#resultRevisionBtn')?.addEventListener('click', () => setTab('revision'));

    $$('[data-result-choco]').forEach(btn => {
      btn.addEventListener('click', () => openChocolateModal(btn.dataset.resultChoco));
    });
  }

  function bindRevision() {
    $('#revisionQuizBtn')?.addEventListener('click', () => {
      createQuizSession(['Toutes'], Math.min(10, Math.max(5, state.revisionIds.length)), true);
      setTab('quiz');
    });

    $('#clearRevisionBtn')?.addEventListener('click', () => {
      if (!state.revisionIds.length) return;
      state.revisionIds = [];
      saveState();
      showToast('Liste de révision vidée.', 'warning');
      render();
    });

    $$('[data-revision-open]').forEach(btn => {
      btn.addEventListener('click', () => openChocolateModal(btn.dataset.revisionOpen));
    });

    $$('[data-revision-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.revisionIds = state.revisionIds.filter(id => id !== btn.dataset.revisionRemove);
        saveState();
        render();
      });
    });
  }

  function bindProgression() {
    $('#resetDataBtn')?.addEventListener('click', () => {
      const ok = window.confirm('Réinitialiser toutes les données de l’Académie Cacao sur ce navigateur ?');
      if (!ok) return;
      resetState();
      quizState = null;
      showToast('Progression réinitialisée.', 'warning');
      render();
    });

    $$('[data-progress-open]').forEach(btn => {
      btn.addEventListener('click', () => openChocolateModal(btn.dataset.progressOpen));
    });
  }

  // ============================================================
  // START
  // ============================================================
  render();
})();
